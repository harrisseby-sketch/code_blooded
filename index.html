<!DOCTYPE html>
<html lang="en" ng-app="queueSyncApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueueSync - Campus Queue Tracker</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Background Ambient Glow Shapes -->
  <div class="bg-shape bg-shape-1" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-2" aria-hidden="true"></div>

  <!-- Global Application Navigation Bar (student sessions only) -->
  <header class="app-navbar" role="banner" ng-hide="auth.isAdmin()">
    <div class="navbar-container">
      <a class="navbar-brand" href="#/home" title="QueueSync Home">
        <div class="navbar-logo-icon">Q</div>
        <span class="navbar-brand-text">QueueSync</span>
        <span class="navbar-tag">Campus Hub</span>
      </a>

      <!-- Navbar Actions (Active when logged in) -->
      <div class="navbar-actions" ng-show="auth.isLoggedIn() || auth.isAdmin()">
        <a class="btn-profile" ng-if="auth.isAdmin()" href="#/admin" title="Open admin dashboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Admin</span>
        </a>

        <button type="button" class="btn-profile" ng-if="auth.isLoggedIn() && !auth.isAdmin()" ng-click="goToProfile()" title="My account / Recent queues">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Profile</span>
        </button>

        <div class="student-badge" ng-if="auth.isLoggedIn() && !auth.isAdmin()" title="Active Student Session">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>ID: <strong>{{auth.getStudentId()}}</strong></span>
        </div>

        <div class="student-badge admin-badge" ng-if="auth.isAdmin()" title="Active Admin Session">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-3 8-10V5l-8-3-8 3v7c0 7 8 10 8 10z"></path>
            <path d="M9 12l2 2 4-4"></path>
          </svg>
          <span>Admin</span>
        </div>

        <button type="button" class="btn-logout" ng-click="globalLogout()" title="Log out of session">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Route Content Container -->
  <main class="main-view-container" role="main">
    <div ng-view></div>
  </main>

  <!-- Global "You're next" Notification Banner (students only) -->
  <aside class="next-banner-wrap" aria-live="assertive" ng-show="nextNotification.visible && !auth.isAdmin()" ng-click="dismissNextNotification()">
    <div class="next-banner" ng-class="'next-' + nextNotification.kind">
      <div class="next-banner-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </div>
      <div class="next-banner-text">
        <strong>{{nextNotification.message}}</strong>
        <span>Please make your way to the counter.</span>
      </div>
      <button
        type="button"
        class="next-banner-sound"
        ng-click="$event.stopPropagation(); toggleNextSound();"
        ng-class="{'sound-on': nextNotification.soundEnabled}"
        title="Toggle alert sound">
        <span ng-if="!nextNotification.soundEnabled">Sound off</span>
        <span ng-if="nextNotification.soundEnabled">Sound on</span>
      </button>
      <button type="button" class="next-banner-close" ng-click="$event.stopPropagation(); dismissNextNotification()" aria-label="Dismiss notification">
        &times;
      </button>
    </div>
  </aside>

  <!-- Global Toast Notification Banner (all sessions — students & admin) -->
  <aside class="toast-container" aria-live="polite" ng-show="toast.visible">
    <div class="toast" ng-class="{'toast-success': toast.type === 'success', 'toast-info': toast.type === 'info', 'toast-warning': toast.type === 'warning'}">
      <div class="toast-message">
        <svg ng-if="toast.type === 'success'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <svg ng-if="toast.type === 'info'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <svg ng-if="toast.type === 'warning'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>{{toast.message}}</span>
      </div>
      <button type="button" class="btn-toast-close" ng-click="dismissToast()" aria-label="Close notification">
        &times;
      </button>
    </div>
  </aside>

  <!-- ================================================================= -->
  <!-- Inline Template Cache Definitions (Enables direct file:// opening) -->
  <!-- ================================================================= -->

  <!-- Login Template -->
  <script type="text/ng-template" id="templates/login.html">
    <div class="login-view-wrapper">
      <div class="login-wrapper">
        <div class="login-card">
          <!-- Branding -->
          <div class="brand">
            <div class="brand-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </div>
            <h1 class="brand-name">QueueSync</h1>
            <p class="brand-tagline">Real-time campus queue tracker</p>
          </div>

          <!-- Role Switch: Student / Admin -->
          <div class="login-role-switch" role="tablist" aria-label="Login type">
            <button
              type="button"
              class="login-role-tab"
              ng-class="{'active': role === 'student'}"
              ng-click="switchRole('student')"
              role="tab"
              aria-selected="role === 'student'"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              <span>Student</span>
            </button>
            <button
              type="button"
              class="login-role-tab"
              ng-class="{'active': role === 'admin'}"
              ng-click="switchRole('admin')"
              role="tab"
              aria-selected="role === 'admin'"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-3 8-10V5l-8-3-8 3v7c0 7 8 10 8 10z"></path>
                <path d="M9 12l2 2 4-4"></path>
              </svg>
              <span>Admin</span>
            </button>
          </div>

          <!-- Student Login Form -->
          <form name="loginForm" ng-submit="handleLogin()" ng-show="role === 'student'" novalidate>
            <div class="form-group">
              <label for="studentId" class="form-label">
                Student ID
                <span class="label-hint">(5 digits ending in 23, 24, 25, 26)</span>
              </label>

              <div class="input-with-icon">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                  <circle cx="9" cy="10" r="2"></circle>
                  <line x1="15" y1="8" x2="17" y2="8"></line>
                  <line x1="15" y1="12" x2="17" y2="12"></line>
                  <line x1="7" y1="16" x2="17" y2="16"></line>
                </svg>
                <input
                  type="tel"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  maxlength="5"
                  id="studentId"
                  name="studentId"
                  class="form-input"
                  placeholder="e.g. 12326 or 54325"
                  ng-model="studentId"
                  ng-disabled="isSubmitting"
                  ng-class="{'input-error': errorMessage}"
                  autocomplete="off"
                  autofocus
                  required
                >
              </div>

              <span class="error-message" ng-show="errorMessage" role="alert">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px; flex-shrink: 0;">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="8" x2="12" y2="12"></line>
                  <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                {{errorMessage}}
              </span>
            </div>

            <button
              type="submit"
              class="btn-submit"
              ng-disabled="isSubmitting || !studentId"
              ng-class="{'btn-disabled': isSubmitting || !studentId}"
            >
              <span class="btn-text" ng-hide="isSubmitting">Enter QueueSync</span>
              <span class="btn-spinner" ng-show="isSubmitting">
                <span class="spinner"></span>
                Signing in...
              </span>
            </button>
          </form>

          <!-- Admin Login Form -->
          <form name="adminForm" ng-submit="handleAdminLogin()" ng-show="role === 'admin'" novalidate>
            <div class="form-group">
              <label for="adminCode" class="form-label">
                Admin access code
                <span class="label-hint">(special staff code)</span>
              </label>

              <div class="input-with-icon">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input
                  type="password"
                  id="adminCode"
                  name="adminCode"
                  class="form-input"
                  placeholder="ADMIN@2026"
                  ng-model="adminCode"
                  ng-disabled="isSubmitting"
                  ng-class="{'input-error': errorMessage}"
                  autocomplete="off"
                  required
                >
              </div>

              <span class="error-message" ng-show="errorMessage" role="alert">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px; flex-shrink: 0;">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="8" x2="12" y2="12"></line>
                  <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                {{errorMessage}}
              </span>
            </div>

            <button
              type="submit"
              class="btn-submit admin-btn-submit"
              ng-disabled="isSubmitting || !adminCode"
              ng-class="{'btn-disabled': isSubmitting || !adminCode}"
            >
              <span class="btn-text" ng-hide="isSubmitting">Login as Admin</span>
              <span class="btn-spinner" ng-show="isSubmitting">
                <span class="spinner"></span>
                Verifying...
              </span>
            </button>

            <p class="admin-demo-hint">Demo access code <strong>ADMIN@2026</strong> is pre-filled &mdash; just tap <strong>Login as Admin</strong>.</p>
          </form>
        </div>
      </div>
    </div>
  </script>

  <!-- Admin Dashboard Template -->
  <script type="text/ng-template" id="templates/admin.html">
    <div class="page-container admin-view">
      <!-- Back Button & Breadcrumb Navigation -->
      <nav class="detail-nav">
        <div class="detail-nav-actions">
          <div class="live-pill">
            <span class="pulse-dot active"></span>
            <span>Admin</span>
          </div>
          <button type="button" class="btn-logout" ng-click="logoutAdmin()" title="Log out of admin session">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Logout</span>
          </button>
        </div>
      </nav>

      <!-- Page Header -->
      <header class="admin-head">
        <div>
          <h1 class="location-title">Admin Dashboard</h1>
          <p class="admin-subtitle">Live store data &mdash; queues, food availability and orders.</p>
        </div>
        <button type="button" class="food-btn-ghost" ng-click="refresh()" ng-disabled="isLoading">
          {{isLoading ? 'Refreshing...' : 'Refresh'}}
        </button>
      </header>

      <!-- Now Serving: the FIRST request in each queue, updated live via
           QueueService ('db:changed'). -->
      <div class="now-serving-grid">

        <!-- ============ CANTEEN NOW SERVING ============ -->
        <section class="food-card admin-section now-serving-card ns-canteen"
                 ng-class="{'ns-empty-card': !nowServing.canteen}">
          <div class="admin-section-head">
            <h2 class="admin-section-title">
              <span class="ns-live-dot" ng-class="{'active': nowServing.canteen}"></span>
              Now Serving &middot; Canteen
              <span class="admin-chip" ng-if="stats.canteenCount > 0">{{stats.canteenCount}} waiting</span>
            </h2>
          </div>

          <div class="ns-body" ng-if="nowServing.canteen">
            <div class="ns-hero">
              <span class="ns-token">#1</span>
              <div class="ns-hero-info">
                <strong class="ns-student">{{nowServing.canteen.studentId}}</strong>
                <span class="ns-meta">In queue since {{formatTime(nowServing.canteen.joinedAt)}} &middot; called to Counter 1</span>
              </div>
            </div>

            <div class="ns-order" ng-if="nowServing.canteen.order">
              <div class="ns-order-title">Order {{nowServing.canteen.order.orderNo}}</div>
              <ul class="ns-order-items">
                <li ng-repeat="it in nowServing.canteen.order.items">
                  {{it.emoji}} {{it.name}} <strong>&times;{{it.qty}}</strong>
                </li>
              </ul>
              <div class="ns-order-total">Total &#8377;{{nowServing.canteen.order.total}}</div>
            </div>
            <p class="ns-note" ng-if="!nowServing.canteen.order">
              Waiting to place their order at the counter.
            </p>

            <div class="ns-actions">
              <button type="button" class="btn-action btn-serve btn-serve-canteen"
                      ng-click="serveCanteen()"
                      ng-disabled="isActing.canteen"
                      ng-class="{'btn-disabled': isActing.canteen}">
                <span class="btn-spinner" ng-show="isActing.canteen"><span class="spinner"></span> Serving...</span>
                <span class="btn-content" ng-hide="isActing.canteen">Mark as Served</span>
              </button>
            </div>
          </div>

          <div class="ns-empty" ng-if="!nowServing.canteen">
            <p>No pending requests</p>
            <span>Students who join the canteen queue appear here first, live.</span>
            <button type="button" class="btn-action btn-serve btn-disabled" disabled aria-disabled="true">
              Mark as Served
            </button>
          </div>
        </section>

        <!-- ============ PHOTOSTAT NOW SERVING ============ -->
        <section class="food-card admin-section now-serving-card ns-photostat"
                 ng-class="{'ns-empty-card': !nowServing.photostat}">
          <div class="admin-section-head">
            <h2 class="admin-section-title">
              <span class="ns-live-dot" ng-class="{'active': nowServing.photostat}"></span>
              Now Serving &middot; Photostat
              <span class="admin-chip" ng-if="stats.photostatCount > 0">{{stats.photostatCount}} waiting</span>
            </h2>
          </div>

          <div class="ns-body" ng-if="nowServing.photostat">
            <div class="ns-hero">
              <span class="ns-token">#1</span>
              <div class="ns-hero-info">
                <strong class="ns-student">{{nowServing.photostat.studentId}}</strong>
                <span class="ns-meta">
                  {{nowServing.photostat.request.serviceLabel || 'Print / Photostat'}}
                  &middot; job {{nowServing.photostat.request.orderNo || '—'}}
                </span>
              </div>
            </div>

            <div class="ns-job-details" ng-if="nowServing.photostat.hasRequest">
              <div class="ns-job-row"><span>Pages</span><strong>{{nowServing.photostat.request.pages || '—'}}</strong></div>
              <div class="ns-job-row"><span>Copies</span><strong>{{nowServing.photostat.request.copies || 1}}</strong></div>
              <div class="ns-job-row"><span>Ink</span><strong>{{nowServing.photostat.request.color === 'color' ? 'Colour' : 'B/W'}}</strong></div>
              <div class="ns-job-row"><span>Sides</span><strong>{{nowServing.photostat.request.sides === 'double' ? 'Double-sided' : 'Single-sided'}}</strong></div>
              <div class="ns-job-row"><span>Amount</span><strong>&#8377;{{nowServing.photostat.request.amount || '—'}} <em>({{nowServing.photostat.request.paymentLabel || 'paid'}})</em></strong></div>
              <div class="ns-job-row" ng-if="nowServing.photostat.request.files && nowServing.photostat.request.files.length">
                <span>Files</span>
                <strong class="ns-file-list">
                  <span class="ns-file-chip" ng-repeat="f in nowServing.photostat.request.files track by f.name">
                    &#128206; {{f.name}}
                    <a ng-if="f.previewUrl || f.url" ng-href="{{f.previewUrl || f.url}}" target="_blank" rel="noopener" title="Open file">open</a>
                  </span>
                </strong>
              </div>
            </div>

            <div class="ns-actions ns-actions-2">
              <button type="button" class="btn-action btn-print"
                      ng-click="printPhotostat()"
                      ng-disabled="isActing.photostat">
                Print
              </button>
              <button type="button" class="btn-action btn-serve btn-serve-photostat"
                      ng-click="servePhotostat()"
                      ng-disabled="isActing.photostat"
                      ng-class="{'btn-disabled': isActing.photostat}">
                <span class="btn-spinner" ng-show="isActing.photostat"><span class="spinner"></span> Working...</span>
                <span class="btn-content" ng-hide="isActing.photostat">Serve / Done</span>
              </button>
            </div>
          </div>

          <div class="ns-empty" ng-if="!nowServing.photostat">
            <p>No pending requests</p>
            <span>Paid print / photostat jobs appear here first, live.</span>
            <button type="button" class="btn-action btn-serve btn-disabled" disabled aria-disabled="true">
              Print &middot; Serve / Done
            </button>
          </div>
        </section>
      </div>

      <!-- Multi-device sync status: the Food orders count below ticks up
           live whenever ANY linked device checks out. -->
      <section class="food-card admin-section admin-sync-section">
        <div class="admin-section-head">
          <h2 class="admin-section-title">
            Multi-device sync
            <span class="admin-chip" ng-class="{'sync-live': sync.mode === 'live', 'sync-local': sync.mode !== 'live'}">
              <span class="busyness-dot" ng-class="{'active': sync.mode === 'live'}"></span>
              {{sync.mode === 'live' ? 'Live multi-device' : sync.mode === 'connecting' ? 'Connecting…' : sync.mode === 'error' ? 'Sync error — local data' : 'Local demo'}}
            </span>
          </h2>
          <button type="button" class="food-btn-ghost" ng-click="retrySync()">Retry connection</button>
        </div>
        <p class="admin-empty" style="margin-bottom:6px">
          This device: <strong>{{sync.deviceId}}</strong> &middot; {{sync.message}}
          <span ng-if="sync.lastSyncAt"> &middot; last sync {{formatTime(sync.lastSyncAt)}}</span>
        </p>
        <p class="admin-empty" ng-if="sync.mode !== 'live'">
          To link multiple devices: create a free Supabase project, run <em>supabase-schema.sql</em>, expose the
          <em>student</em> + <em>admin</em> schemas (Settings &gt; API), then copy
          <em>js/supabase-config.example.js</em> to <em>js/supabase-config.js</em> with your URL + anon key and reload every device.
        </p>
      </section>

      <p class="admin-last-refresh" ng-if="refreshedAt">Last refreshed at {{formatTime(refreshedAt)}} &middot; auto-updates every 10s</p>

      <!-- Live Stats Grid -->
      <div class="stats-display-grid">
        <div class="stat-card">
          <div class="stat-meta">
            <span class="stat-label">Canteen queue</span>
            <span class="stat-sublabel">Students waiting now</span>
          </div>
          <div class="stat-big-number">
            <span class="counter-number">{{stats.canteenCount}}</span>
          </div>
          <div class="stat-footer-text">
            <span ng-if="stats.canteenCount === 0">No one in line</span>
            <span ng-if="stats.canteenCount > 0">{{stats.canteenCount}} in queue</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-meta">
            <span class="stat-label">Photostat queue</span>
            <span class="stat-sublabel">Print / copy jobs waiting</span>
          </div>
          <div class="stat-big-number">
            <span class="counter-number">{{stats.photostatCount}}</span>
          </div>
          <div class="stat-footer-text">
            <span ng-if="stats.photostatCount === 0">No one in line</span>
            <span ng-if="stats.photostatCount > 0">{{stats.photostatCount}} in queue</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-meta">
            <span class="stat-label">Food orders</span>
            <span class="stat-sublabel">Placed via online checkout</span>
          </div>
          <div class="stat-big-number">
            <span class="counter-number">{{stats.orderCount}}</span>
          </div>
          <div class="stat-footer-text">
            <span>Food: {{stats.availableItems}} / {{menu.length}} items available</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-meta">
            <span class="stat-label">Print / photostat jobs</span>
            <span class="stat-sublabel">Paid jobs submitted</span>
          </div>
          <div class="stat-big-number">
            <span class="counter-number">{{stats.jobCount}}</span>
          </div>
          <div class="stat-footer-text">
            <span>{{stats.studentCount}} unique students seen</span>
          </div>
        </div>
      </div>

      <!-- Live Queues (real members only — no bots) -->
      <div class="admin-queues">
        <section class="food-card admin-section">
          <h2 class="admin-section-title">Canteen queue <span class="admin-chip">{{stats.canteenCount}}</span>
            <span class="admin-chip" ng-class="canteenLive.colorClass" title="Voted by users on their devices">{{canteenLive.label}} &middot; {{canteenLive.reports}} vote{{canteenLive.reports === 1 ? '' : 's'}}</span>
          </h2>
          <div class="admin-member-list" ng-if="canteen.members.length">
            <span class="admin-member-chip" ng-repeat="m in canteen.members track by $index">#{{$index + 1}} &middot; {{m.studentId}}</span>
          </div>
          <p class="admin-empty" ng-if="!canteen.members.length">No students in the canteen queue.</p>
        </section>

        <section class="food-card admin-section">
          <h2 class="admin-section-title">Photostat queue <span class="admin-chip">{{stats.photostatCount}}</span>
            <span class="admin-chip" ng-class="photostatLive.colorClass" title="Voted by users on their devices">{{photostatLive.label}} &middot; {{photostatLive.reports}} vote{{photostatLive.reports === 1 ? '' : 's'}}</span>
          </h2>
          <div class="admin-member-list" ng-if="photostat.members.length">
            <span class="admin-member-chip" ng-repeat="m in photostat.members track by $index">#{{$index + 1}} &middot; {{m.studentId}}</span>
          </div>
          <p class="admin-empty" ng-if="!photostat.members.length">No students in the photostat queue.</p>
        </section>
      </div>

      <!-- Food Availability (live stock from admin_db.menu_items) -->
      <section class="food-card admin-section">
        <div class="admin-section-head">
          <h2 class="admin-section-title">Food availability &amp; live stock</h2>
          <span class="admin-chip">Food: {{stats.availableItems}} available / {{stats.soldOutItems}} sold out</span>
        </div>
        <p class="admin-empty" style="margin-bottom:12px">Stock reduces automatically on every student checkout and updates here live. Use + / − to restock or tap the status pill to mark sold out / available.</p>
        <div class="food-option-grid admin-menu-grid">
          <div class="food-option-card admin-menu-card" ng-repeat="item in menu track by item.id">
            <span class="food-option-icon">{{item.emoji}}</span>
            <span class="food-option-name">{{item.name}}</span>
            <span class="food-option-hint">&#8377;{{item.basePrice}} &middot; {{orderItemCount(item.id)}} ordered &middot; <strong>{{item.stockQty}} left</strong></span>
            <button type="button" class="admin-avail" ng-class="item.available ? 'avail-yes' : 'avail-no'" ng-click="toggleAvailability(item)" title="Tap to toggle availability">
              <span class="busyness-dot" ng-class="{'active': item.available}"></span>
              {{item.available ? 'Available' : 'Sold out'}}
            </button>
            <div class="admin-stock-row">
              <button type="button" class="food-qty-btn" ng-click="adjustStock(item, -1)" aria-label="Decrease stock">−</button>
              <span class="food-qty-value">{{item.stockQty}}</span>
              <button type="button" class="food-qty-btn" ng-click="adjustStock(item, 1)" aria-label="Increase stock">+</button>
              <button type="button" class="food-btn-ghost" ng-click="restock(item, 50)">Restock 50</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Food Orders -->
      <section class="food-card admin-section">
        <h2 class="admin-section-title">Food orders <span class="admin-chip">{{stats.orderCount}}</span></h2>
        <div class="admin-table-wrap" ng-if="orders.length">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Student</th>
                <th>Device</th>
                <th>Time</th>
                <th>Items</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Type</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="o in orders track by o.orderNo">
                <td><strong>{{o.orderNo}}</strong></td>
                <td>{{o._studentId}}</td>
                <td>{{o.originDevice || '—'}}</td>
                <td>{{formatDate(o.placedAt)}} {{formatTime(o.placedAt)}}</td>
                <td class="admin-items-cell">
                  <span ng-repeat="it in o.items">
                    {{it.emoji}} {{it.name}} &times;{{it.qty}}<span ng-if="!$last">, </span>
                  </span>
                </td>
                <td>&#8377;{{o.total}}</td>
                <td>{{o.paymentDetail || '—'}}</td>
                <td>{{orderTypeLabel(o.orderType)}}</td>
                <td><span class="admin-status">{{o.status}}</span></td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="admin-empty" ng-if="!orders.length">No orders taken yet. When a student places a food order (pay online) in this browser, it appears here.</p>
      </section>

      <!-- Print / Photostat Jobs -->
      <section class="food-card admin-section">
        <h2 class="admin-section-title">Print / photostat jobs <span class="admin-chip">{{stats.jobCount}}</span></h2>
        <div class="admin-table-wrap" ng-if="photostatJobs.length">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Job #</th>
                <th>Student</th>
                <th>Time</th>
                <th>Service</th>
                <th>Pages</th>
                <th>Files</th>
                <th>Amount</th>
                <th>Payment</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="j in photostatJobs track by j.orderNo">
                <td><strong>{{j.orderNo}}</strong></td>
                <td>{{j._studentId}}</td>
                <td>{{formatDate(j.paidAt)}} {{formatTime(j.paidAt)}}</td>
                <td>{{j.serviceLabel}}</td>
                <td>{{j.pages}}</td>
                <td>{{j.files && j.files.length ? j.files.length : '—'}}</td>
                <td>&#8377;{{j.amount}}</td>
                <td>{{j.paymentLabel}}</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="admin-empty" ng-if="!photostatJobs.length">No print or photostat jobs yet. Submitted jobs from this browser appear here.</p>
      </section>
    </div>
  </script>

  <!-- Canteen Queue Detailed Template -->
  <script type="text/ng-template" id="templates/canteen-queue.html">
    <div class="page-container queue-detail-view theme-canteen">

            <span>Live Sync Active</span>

        <header class="detail-header">
          <div class="header-content">
            <div class="location-badge">
              <div class="location-icon canteen-accent-bg">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>

                  <line x1="14" y1="1" x2="14" y2="4"></line>
